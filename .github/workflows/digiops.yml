name: FreightSlip DigiOps release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bundle_runtime:
        description: Include PHP dependencies for a fresh host or runtime repair
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_BASE_PATH: /freightslip
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, zip, dom, mbstring, xml, xmlreader, xmlwriter, simplexml, fileinfo, iconv, ctype
          tools: composer:v2
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and build static frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
          composer install --working-dir=php --no-dev --prefer-dist --no-interaction
          python -m pip install requests openpyxl pypdf pillow
      - name: Verify 100-LR ZIP batching, cancellation and error handling
        run: node tests/batch-export.cjs
      - name: Check import, issuance and A4 PDF output
        run: |
          find php deploy -path php/vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          LR_RELEASE_SMOKE=1 python tests/smoke.py
      - name: Package and verify the Cloudways layout
        env:
          FREIGHTSLIP_FULL_RUNTIME: ${{ inputs.bundle_runtime }}
        run: |
          mkdir -p release/public/api release/private/app release/private/build
          cp -a out/. release/public/
          cp deploy/digiops-api.php release/public/api/index.php
          cp -a php/*.php php/assets release/private/app/
          cp deploy/runtime.php release/private/app/digiops-runtime.php
          runtime=$(php deploy/runtime.php)
          runtime_id=${runtime% *}
          mode=${runtime##* }
          printf '%s\n' "$runtime_id" > release/private/app/digiops-runtime.sha256
          if [ "$mode" = full ]; then
            mkdir -p release/private/app/runtimes
            cp -a php/vendor "release/private/app/runtimes/$runtime_id"
          fi
          php deploy/package.php
          FREIGHTSLIP_PACKAGE_MODE="$mode" python tests/digiops.py
          du -sh release release/public release/private
          echo "FreightSlip package mode: $mode" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: digiops-release
          path: release/
          include-hidden-files: true
          if-no-files-found: error
